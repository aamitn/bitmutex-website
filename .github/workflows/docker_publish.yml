name: PUBLISH DOCKER IMAGE

on:
  workflow_run:
    workflows: ["TEST & REPORT"]
    types:
      - completed

  # Keeps the manual trigger available just in case
  workflow_dispatch:
    inputs:
      tag_selection:
        description: 'Select or type the Git tag to build (leave blank for auto-resolve)'
        required: false
        default: ''
        type: string

jobs:
  publish_docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Docker Version
        id: version
        run: |
          # 1. Use manual input if provided
          INPUT_TAG="${{ github.event.inputs.tag_selection }}"
          
          # FIXED: Changed invalid Bash '-not -z' to '-n' (not empty)
          if [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
            echo "Using manually entered tag: $VERSION"
          else
            # 2. Try exact current commit tag first
            VERSION=$(git describe --tags --exact-match 2>/dev/null || true)

            # 3. Fallback to latest available tag in history
            if [ -z "$VERSION" ]; then
              VERSION=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || true)
            fi

            # 4. Final fallback
            if [ -z "$VERSION" ]; then
              VERSION="latest"
            fi
            echo "Auto-resolved tag to: $VERSION"
          fi

          # Remove optional leading "v"
          CLEAN_VERSION=${VERSION#v}

          echo "VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "Using Docker version tag: $CLEAN_VERSION"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Multi-Arch Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t bitmutex/bm-site:latest \
            -t bitmutex/bm-site:${VERSION} \
            --push .

      - name: Show Published Tags
        run: |
          echo "Published:"
          echo " - bitmutex/bm-site:latest"
          echo " - bitmutex/bm-site:${VERSION}"