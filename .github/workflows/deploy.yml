name: Deploy Strapi & Next.js via SSH to Server

on:
  workflow_dispatch: # Allows you to trigger the deployment manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-passphrase: ${{ secrets.SSH_PASSPHRASE }} # Added passphrase support here

      - name: Deploy and Build via SSH
        env:
          SSH_HOST: 68.233.96.154
        run: |
          # Note: Changed 'ubuntu' to 'bigwiz' based on your target directory structure
          ssh -o StrictHostKeyChecking=no bigwiz@$SSH_HOST << 'EOF'
            
            # Load environment variables for non-interactive shells
            if [ -f ~/.zshrc ]; then source ~/.zshrc; fi

            echo "Starting deployment on server..."
            APP_DIR="/home/bigwiz/apps/bitmutex-website"
            REPO_URL="https://github.com/aamitn/bitmutex-website.git"
      
            # Check if the directory exists and clone if it doesn't
            if [ ! -d "$APP_DIR" ]; then
              echo "Directory $APP_DIR does not exist. Cloning repository..."
              mkdir -p /home/bigwiz/apps
              cd /home/bigwiz/apps
              git clone "$REPO_URL" "$APP_DIR"
            fi
            
            cd "$APP_DIR"
      
            echo "Deploying application..."
            git fetch --all
            git reset --hard origin/main
            
            # PM2 updates and builds
            pm2 stop bitmutex-strapi || true
            pm2 stop bitmutex-nextjs || true
            
            pnpm deepclean
            pnpm spawn
            pnpm build
            
            pm2 reload ecosystemci.config.cjs
            echo "Deployment complete!"
          EOF

      - name: Audit URLs using Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://bitmutex.com/
          uploadArtifacts: true # save results as an action artifacts
          temporaryPublicStorage: true # upload lighthouse report to the temporary storage