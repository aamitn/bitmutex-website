name: Deploy Strapi & Next.js via SSH to Server

on:
  workflow_dispatch: # Allows you to trigger the deployment manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy and Build via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 68.233.96.154
          username: bigwiz # Using 'bigwiz' to match your target directory path
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} # Securely passes your passphrase
          envs: GITHUB_SHA # Optional: passes metadata if you need it
          script: |
            # Load environment variables for non-interactive shells
            if [ -f ~/.zshrc ]; then source ~/.zshrc; fi

            echo "Starting deployment on server..."
            APP_DIR="/home/bigwiz/apps/bitmutex-website"
            REPO_URL="https://github.com/aamitn/bitmutex-website.git"
      
            # Check if the directory exists and clone if it doesn't
            if [ ! -d "$APP_DIR" ]; then
              echo "Directory $APP_DIR does not exist. Cloning repository..."
              mkdir -p /home/bigwiz/apps
              cd /home/bigwiz/apps
              git clone "$REPO_URL" "$APP_DIR"
            fi
            
            cd "$APP_DIR"
      
            echo "Deploying application..."
            git fetch --all
            git reset --hard origin/main
            
            # Stop existing processes gracefully (preventing crash if not running)
            pm2 stop bitmutex-strapi || true
            pm2 stop bitmutex-nextjs || true
            
            # Application build process
            pnpm deepclean
            pnpm spawn
            pnpm build
            
            # Restart application via ecosystem file
            pm2 reload ecosystemci.config.cjs
            echo "Deployment complete!"

      - name: Audit URLs using Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://bitmutex.com/
          uploadArtifacts: true # save results as action artifacts
          temporaryPublicStorage: true # upload lighthouse report to temporary storage
