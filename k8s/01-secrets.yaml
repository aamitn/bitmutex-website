apiVersion: v1
kind: Secret
metadata:
  name: bitmutex-secrets
type: Opaque
stringData:
  # ============================================================================
  # Database Configuration
  # ============================================================================
  DATABASE_NAME: strapi-bitmutex
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: "1234qwer"  # CHANGE THIS IN PRODUCTION
  DATABASE_CLIENT: postgres
  DATABASE_HOST: postgres  # K8s service name
  DATABASE_PORT: "5432"

  # ============================================================================
  # Strapi Security Keys (REQUIRED - Generate using `openssl rand -hex 32`)
  # ============================================================================
  APP_KEYS: "toBeModified1,toBeModified2,toBeModified3,toBeModified4"
  API_TOKEN_SALT: "toBeModifiedApiTokenSalt"
  ADMIN_JWT_SECRET: "toBeModifiedAdminJwtSecret"
  JWT_SECRET: "toBeModifiedJwtSecret"
  TRANSFER_TOKEN_SALT: "toBeModifiedTransferTokenSalt"
  ENCRYPTION_KEY: "toBeModifiedEncryptionKey"

  # ============================================================================
  # Strapi Configuration
  # ============================================================================
  STRAPI_PORT: "1337"
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  AUTO_CREATE_ADMIN: "false"
  STRAPI_BASE_URL: "http://localhost:1337"  # Internal container URL

  # ============================================================================
  # Next.js Configuration
  # ============================================================================
  NEXT_PORT: "3000"
  NEXT_PUBLIC_STRAPI_BASE_URL: "https://strapiadmin.bitmutex.com"  # Public domain for frontend
  DISABLE_TYPECHECK: "false"

  # ============================================================================
  # Email Configuration (Strapi nodemailer provider)
  # ============================================================================
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: "your-email@gmail.com"
  SMTP_PASSWORD: "your-app-password"
  SMTP_FROM: "noreply@bitmutex.com"
  SMTP_FROM_NAME: "Bitmutex"

  # ============================================================================
  # AWS/S3 Configuration (if using for uploads/backups)
  # ============================================================================
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  AWS_REGION: "us-east-1"
  AWS_BUCKET: "bitmutex-uploads"

  # ============================================================================
  # Cloudflare R2 (if using instead of S3)
  # ============================================================================
  R2_ACCESS_KEY_ID: "your-r2-access-key"
  R2_SECRET_ACCESS_KEY: "your-r2-secret-key"
  R2_BUCKET: "bitmutex-r2"
  R2_ENDPOINT: "https://your-account-id.r2.cloudflarestorage.com"

  # ============================================================================
  # Algolia Search Configuration (if integrated)
  # ============================================================================
  ALGOLIA_APP_ID: "your-algolia-app-id"
  ALGOLIA_ADMIN_API_KEY: "your-algolia-admin-key"
  ALGOLIA_SEARCH_API_KEY: "your-algolia-search-key"

  # ============================================================================
  # Discord Bot Configuration (if enabled)
  # ============================================================================
  DISCORD_BOT_TOKEN: "your-discord-bot-token"
  DISCORD_GUILD_ID: "your-discord-guild-id"

  # ============================================================================
  # Sentry Configuration (error tracking)
  # ============================================================================
  SENTRY_DSN: "your-sentry-dsn"
  SENTRY_ENVIRONMENT: "production"

  # ============================================================================
  # Application URLs
  # ============================================================================
  NEXT_PUBLIC_API_URL: "https://api.bitmutex.com"
  NEXT_PUBLIC_WEBSITE_URL: "https://bitmutex.com"