apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  # ============================================================================
  # Database Configuration
  # ============================================================================
  DATABASE_NAME: {{ .Values.postgres.database | quote }}
  DATABASE_USERNAME: {{ .Values.postgres.username | quote }}
  DATABASE_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_CLIENT: {{ .Values.postgres.client | default "postgres" | quote }}
  DATABASE_HOST: {{ .Values.postgres.host | default "postgres" | quote }}
  DATABASE_PORT: {{ .Values.postgres.port | default "5432" | quote }}

  # ============================================================================
  # Strapi Security Keys (REQUIRED - Generate using `openssl rand -hex 32`)
  # ============================================================================
  APP_KEYS: {{ .Values.strapi.appKeys | quote }}
  API_TOKEN_SALT: {{ .Values.strapi.apiTokenSalt | quote }}
  ADMIN_JWT_SECRET: {{ .Values.strapi.adminJwtSecret | quote }}
  JWT_SECRET: {{ .Values.strapi.jwtSecret | quote }}
  TRANSFER_TOKEN_SALT: {{ .Values.strapi.transferTokenSalt | quote }}
  ENCRYPTION_KEY: {{ .Values.strapi.encryptionKey | quote }}

  # ============================================================================
  # Strapi Configuration
  # ============================================================================
  STRAPI_PORT: {{ .Values.strapi.port | default "1337" | quote }}
  NODE_ENV: {{ .Values.environment | default "production" | quote }}
  HOST: {{ .Values.strapi.host | default "0.0.0.0" | quote }}
  AUTO_CREATE_ADMIN: {{ .Values.strapi.autoCreateAdmin | default "false" | quote }}
  STRAPI_BASE_URL: {{ .Values.strapi.baseUrl | quote }}

  # ============================================================================
  # Next.js Configuration
  # ============================================================================
  NEXT_PORT: {{ .Values.nextjs.port | default "3000" | quote }}
  NEXT_PUBLIC_STRAPI_BASE_URL: {{ .Values.nextjs.strapiBaseUrl | quote }}
  DISABLE_TYPECHECK: {{ .Values.nextjs.disableTypecheck | default "false" | quote }}

  # ============================================================================
  # Email Configuration (Strapi nodemailer provider)
  # ============================================================================
  SMTP_HOST: {{ .Values.email.host | quote }}
  SMTP_PORT: {{ .Values.email.port | quote }}
  SMTP_USERNAME: {{ .Values.email.username | quote }}
  SMTP_PASSWORD: {{ .Values.email.password | quote }}
  SMTP_FROM: {{ .Values.email.from | quote }}
  SMTP_FROM_NAME: {{ .Values.email.fromName | quote }}

  # ============================================================================
  # AWS/S3 Configuration (if using for uploads/backups)
  # ============================================================================
  AWS_ACCESS_KEY_ID: {{ .Values.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.aws.secretAccessKey | quote }}
  AWS_REGION: {{ .Values.aws.region | quote }}
  AWS_BUCKET: {{ .Values.aws.bucket | quote }}

  # ============================================================================
  # Cloudflare R2 (if using instead of S3)
  # ============================================================================
  R2_ACCESS_KEY_ID: {{ .Values.r2.accessKeyId | quote }}
  R2_SECRET_ACCESS_KEY: {{ .Values.r2.secretAccessKey | quote }}
  R2_BUCKET: {{ .Values.r2.bucket | quote }}
  R2_ENDPOINT: {{ .Values.r2.endpoint | quote }}

  # ============================================================================
  # Algolia Search Configuration (if integrated)
  # ============================================================================
  ALGOLIA_APP_ID: {{ .Values.algolia.appId | quote }}
  ALGOLIA_ADMIN_API_KEY: {{ .Values.algolia.adminApiKey | quote }}
  ALGOLIA_SEARCH_API_KEY: {{ .Values.algolia.searchApiKey | quote }}

  # ============================================================================
  # Discord Bot Configuration (if enabled)
  # ============================================================================
  DISCORD_BOT_TOKEN: {{ .Values.discord.botToken | quote }}
  DISCORD_GUILD_ID: {{ .Values.discord.guildId | quote }}

  # ============================================================================
  # Sentry Configuration (error tracking)
  # ============================================================================
  SENTRY_DSN: {{ .Values.sentry.dsn | quote }}
  SENTRY_ENVIRONMENT: {{ .Values.sentry.environment | quote }}

  # ============================================================================
  # Application URLs
  # ============================================================================
  NEXT_PUBLIC_API_URL: {{ .Values.urls.apiUrl | quote }}
  NEXT_PUBLIC_WEBSITE_URL: {{ .Values.urls.websiteUrl | quote }}